conky.config = {
    -- إعدادات النافذة المتوافقة تماماً مع i3
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_class = 'Conky',
    
    -- التموضع على الشاشة (اليمين تحت الشريط)
    alignment = 'top_right',
    gap_x = 30,
    gap_y = 50,
    minimum_width = 260,
    maximum_width = 260,
    
    -- المظهر والخطوط (استبدل JetBrainsMono Nerd Font بالخط الذي تستخدمه)
    background = true,
    double_buffer = true,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    default_color = 'white',
    
    -- لوحة الألوان
    color1 = '#88c0d0', -- أزرق بارد (للعناوين)
    color2 = '#81a1c1', -- أزرق ثانوي
    color3 = '#eceff4', -- أبيض ناصع للنصوص
    color4 = '#a3be8c', -- أخضر (للإنخفاض/الاستقرار)
    
    update_interval = 1.0,
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:bold:size=22}${alignc}${time %H:%M}${font}${color}
${color2}${font JetBrainsMono Nerd Font:size=9}${alignc}${time %A, %B %d}${font}${color}

${color1}${hr 2}${color}
${color1}󰻠 SYSTEM${color}
${color3}Uptime:    ${alignr}$uptime${color}
${color3}Kernel:    ${alignr}$kernel${color}

${color1}󰍛 CPU${color}
Usage: ${alignr}${cpu cpu0}%
${color2}${cpubar 6 cpu0}${color}

${color1}󰘚 RAM${color}
Used: $mem / $memmax ${alignr}$memperc%
${color2}${membar 6}${color}

${color1}󰋊 STORAGE${color}
Root: ${fs_used /} / ${fs_size /} ${alignr}${fs_used_perc /}%
${color2}${fs_bar 6 /}${color}
]]
